<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bobine</title>
    <meta
      name="description"
      content="Vos sorties méritent leur propre série. Chaque moment devient un épisode, à revoir ensemble avec Bobine."
    />

    <!-- Link preview in WhatsApp, iMessage, Messenger…  The invitation link gets
         its own wording: scripts/invite-page.mjs rewrites the two lines marked
         "invite" into dist/join.html at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bobine" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Bobine : vos sorties méritent leur propre série" />
    <meta property="og:description" content="Chaque moment devient un épisode. Chacun écrit sa review en secret, et tout se révèle d'un coup." />
    <meta property="og:image" content="https://app.nouschill.fr/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA manifest + installability -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#151012" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Bobine" />

    <!-- iOS home-screen web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bobine" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons / favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- The `react-native-web` recommended style reset. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background-color: #151012;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Tu dois activer JavaScript pour utiliser Bobine.</noscript>
    <div id="root"></div>
  </body>
</html>
